# Reverse proxy of the editor (section 4 of UI-SPEC.md): it serves no files and logs no query strings.
# Unprivileged: it listens on 8080 inside the container (published only on 127.0.0.1) and writes only to /tmp,
# which is a tmpfs. Mounted read-only as /etc/nginx/nginx.conf.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # $uri has no query string (it can hold a time in a video) and the media are opaque ids anyway.
    log_format editor '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout editor;

    # Docker's resolver, so the address of `editor` is looked up again if the container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;

        client_max_body_size 16m;  # the plan is saved whole; the API refuses more than 8 MiB itself

        location / {
            set $editor http://editor:8000;
            proxy_pass $editor;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;  # the editor checks it (127.0.0.1:8080 or localhost:8080)
            proxy_set_header Connection "";
            proxy_buffering off;               # videos stream, Range requests go through untouched
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
