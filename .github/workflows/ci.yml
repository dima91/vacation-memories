name: CI

on:
  push:
    branches: [main, develop, "release/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version=$(grep -Po '__version__ = "\K[^"]+' vacation_memories/__init__.py)
          tag_version=${GITHUB_REF_NAME#v}
          if [[ $package_version != "$tag_version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match __version__ $package_version" >&2
            exit 1
          fi

      - name: Check that the changelog describes the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/ci_release_notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Prepare the environment
        run: |
          cp .env.example .env
          sed -i \
            -e "s/^HOST_UID=.*/HOST_UID=$(id -u)/" \
            -e "s/^HOST_GID=.*/HOST_GID=$(id -g)/" \
            -e "s/^COMPOSE_FILE=.*/COMPOSE_FILE=compose.yaml/" \
            .env
          mkdir -p dev-media music work

      - name: Build the dev images
        run: docker compose --profile dev build dev ui-dev

      - name: Run the tests
        run: docker compose run --rm -T --no-deps dev pytest

      - name: Check and test the interface
        run: |
          docker compose run --rm -T --no-deps ui-dev npm run check
          docker compose run --rm -T --no-deps ui-dev npm test

  container-tests:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run the container tests
        run: scripts/test-docker.sh

  # The image the launcher pulls: published on Docker Hub only for a release tag, and only when both test jobs pass.
  # Needs the repository variable IMAGE_NAME (<namespace>/<image_name>) and the secrets DOCKERHUB_USERNAME and
  # DOCKERHUB_TOKEN (README, "Continuous integration").
  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, container-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute the image tags
        id: tags
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          TAG: ${{ github.ref_name }}
        run: |
          images=$(scripts/ci_image_tags.sh "$IMAGE_NAME" "$TAG")
          {
            echo "tags<<EOF"
            echo "$images"
            echo "EOF"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: APP_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true

  # The launcher and the release page: built with the same IMAGE_NAME the image was just pushed to, and attached to a
  # GitHub release whose notes are the section of CHANGELOG.md for the version. The only job allowed to write.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the environment
        run: |
          cp .env.example .env
          sed -i \
            -e "s/^HOST_UID=.*/HOST_UID=$(id -u)/" \
            -e "s/^HOST_GID=.*/HOST_GID=$(id -g)/" \
            -e "s/^COMPOSE_FILE=.*/COMPOSE_FILE=compose.yaml/" \
            .env

      - name: Build the launcher
        env:
          IMAGE_REPO: ${{ vars.IMAGE_NAME }}
          TAG: ${{ github.ref_name }}
        run: |
          export APP_VERSION=${TAG#v}
          docker compose --profile dev build launcher-build
          docker compose run --rm -T launcher-build

      - name: Name the files and write the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          name=vacation-memories-$version-linux-x86_64
          mv dist/vacation-memories "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          scripts/ci_release_notes.sh "$version" > notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          name=vacation-memories-$version-linux-x86_64
          files=("dist/$name" "dist/$name.sha256")
          prerelease=--prerelease=false
          [[ $version == *-* ]] && prerelease=--prerelease
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md "$prerelease"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --notes-file notes.md --verify-tag "$prerelease"
          fi
